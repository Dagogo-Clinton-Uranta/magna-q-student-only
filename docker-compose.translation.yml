services:
  libretranslate:
    image: libretranslate/libretranslate:v1.8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      LT_LOAD_ONLY: en,es,pt,fr,hi,bn
      LT_UPDATE_MODELS: "true"
      LT_DISABLE_WEB_UI: "true"
      LT_TRANSLATION_CACHE: all
      LT_THREADS: "4"
      LT_REQ_LIMIT: "120"
      LT_BATCH_LIMIT: "50"
      LT_CHAR_LIMIT: "16000"
      # Keep Argos' downloaded packages and supporting runtime data inside the
      # same directory Railway mounts as persistent storage.
      XDG_CACHE_HOME: /home/libretranslate/.cache
      XDG_DATA_HOME: /home/libretranslate/.cache/data
      XDG_CONFIG_HOME: /home/libretranslate/.cache/config
      ARGOS_PACKAGES_DIR: /home/libretranslate/.cache/models
    volumes:
      - libretranslate_models:/home/libretranslate/.cache:rw
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s

volumes:
  libretranslate_models:
